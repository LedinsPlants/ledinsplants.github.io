name: Build hybrid pages

on:
  # Varje natt kl. 03:00 UTC
  schedule:
    - cron: "0 3 * * *"
  # Manuellt: fliken Actions -> Build hybrid pages -> Run workflow
  workflow_dispatch:
  # Automatiskt när du ändrar tabellfilen, mallen, skriptet eller adressen
  push:
    paths:
      - "hybrids.csv"
      - "sheet-url.txt"
      - "page-template.html"
      - "build_hybrids.py"
      - "sync_layout.py"
      - "partials/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow pillow-heif

      - name: Build pages
        run: python build_hybrids.py

      - name: Sync header and footer
        run: python sync_layout.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-update hybrid pages"
          git pull --rebase
          git push
